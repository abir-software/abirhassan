<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Md Abir Hassan</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #000; font-family: 'Inter', sans-serif; color: #fff; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.8) 100%); z-index: 2; pointer-events: none; }
        
        #fixed-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 20; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        :root { --accent: #00E5FF; }

        header { position: absolute; top: 0; left: 0; width: 100%; padding: 35px 5vw; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 40px; font-weight: 900; letter-spacing: -2px; text-shadow: 0 0 20px rgba(0, 229, 255, 0.4); text-decoration: none; color: #fff; }
        .logo-x { color: var(--accent); }
        .right-logo { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .yesex-logo { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }

        .social-links { position: absolute; left: -80px; top: 50%; transform: translateY(-50%) rotate(-90deg); display: flex; gap: 30px; font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 3px; font-weight: 700; }
        .social-links a { color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.3s, text-shadow 0.3s; }
        .social-links a:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }

        footer { position: absolute; bottom: 0; left: 0; width: 100%; padding: 35px 5vw; box-sizing: border-box; display: flex; justify-content: space-between; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
        .footer-left, .footer-right { display: flex; gap: 30px; flex-wrap: wrap; }
        footer a { color: rgba(255,255,255,0.6); text-decoration: none; transition: color 0.3s; }
        footer a:hover, footer a.active { color: #fff; }

        #scroll-content { position: relative; z-index: 10; }
        .section { width: 100vw; box-sizing: border-box; padding: 60px 8vw; display: flex; flex-direction: column; justify-content: center; }
        .section.hero { min-height: 100vh; padding-top: 0; padding-bottom: 0; }
        .align-right { align-items: flex-end; text-align: right; }
        .align-left { align-items: flex-start; text-align: left; }
        .content-wrapper { position: relative; max-width: 60vw; z-index: 2; }
        
        .hero-text { font-family: 'DM Serif Display', serif; font-size: 95px; font-weight: 400; line-height: 0.9; letter-spacing: 1px; text-transform: uppercase; color: #fff; margin-bottom: 25px; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .subtitle { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 40px; }
        
        .section-title { font-family: 'Outfit', sans-serif; font-size: 50px; font-weight: 900; letter-spacing: -1px; color: #fff; margin-bottom: 30px; text-transform: uppercase; text-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        
        /* Search & Filters */
        .search-bar { margin-bottom: 20px; width: 100%; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 14px 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; backdrop-filter: blur(10px); outline: none; transition: border-color 0.3s; }
        .search-bar input:focus { border-color: var(--accent); }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 35px; }
        .filter-btn { padding: 8px 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; border-radius: 20px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn:hover, .filter-btn.active { background: rgba(0, 229, 255, 0.15); border-color: var(--accent); color: var(--accent); }

        /* Cards & Grid */
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; width: 100%; }
        .card { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 5px 20px rgba(0,0,0,0.2); padding: 25px; border-radius: 12px; transition: all 0.3s ease; text-align: left; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2); }
        .card-title { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 10px; line-height: 1.3; }
        .card-subtitle { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; }
        .card-text { font-size: 14px; font-weight: 300; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 20px; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 500; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px; }

        @media (max-width: 1024px) { .content-wrapper { max-width: 80vw; } .hero-text { font-size: 70px; } }
        @media (max-width: 768px) { .section { padding: 40px 8vw; } .content-wrapper { max-width: 100vw; text-align: left; } .social-links { display: none; } footer { flex-direction: column; gap: 15px; text-align: center; } .footer-left, .footer-right { justify-content: center; } header { padding: 25px 8vw; } .hero-text { font-size: 50px; } }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>
    <div class="overlay"></div>
    
    <div id="fixed-ui">
        <header class="interactive">
            <a href="index.html" class="logo">A<span class="logo-x">H</span></a>
            <div class="right-logo"><div class="yesex-logo">BLOG</div></div>
        </header>

        <div class="social-links interactive">
            <a href="https://linkedin.com/in/abirhassan">LINKEDIN</a>
            <a href="#">GITHUB</a>
        </div>

        <footer class="interactive">
            <div class="footer-left">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="experience.html">EXPERIENCE</a>
                <a href="qa-testing.html">QA & TESTING</a>
                <a href="pm-details.html">PM DETAILS</a>
                <a href="projects.html">PROJECTS</a>
                <a href="web-dev.html">WEB DEV</a>
                <a href="blog.html" class="active">BLOG</a>
            </div>
            <div class="footer-right">
                <a href="contact.html">CONTACT</a>
            </div>
        </footer>
    </div>

    <div id="scroll-content">
        <section class="section hero align-right">
            <div class="content-wrapper">
                <div class="hero-text">
                    BLOG &<br>
                    INSIGHTS
                </div>
                <div class="subtitle">QA, Software Engineering & Project Management</div>
            </div>
        </section>

        <section class="section align-left">
            <div class="content-wrapper">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search articles by title or keyword..." oninput="debouncedSearch()">
                </div>
                <div class="filters" id="category-filters">
                    <button class="filter-btn active" data-cat="all" onclick="filterByCategory('all')">All Articles</button>
                </div>
                
                <div id="loading" style="color:var(--accent); font-family:'Outfit'; letter-spacing:2px; font-weight:700;">LOADING ARTICLES...</div>
                <div class="blog-grid" id="blog-grid" style="display:none"></div>
                <div id="empty-state" style="display:none; color:rgba(255,255,255,0.5); padding:40px 0;">No articles found matching your criteria.</div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('animationCanvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } resizeCanvas();
        const frameCount = 300; const images = []; const currentFrame = index => `/assets/frames/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`;
        for (let i = 1; i <= frameCount; i++) { const img = new Image(); img.src = currentFrame(i); images.push(img); }
        let targetFrame = 0; let currentFrameIndex = 0;
        function render(frame) {
            const img = images[frame]; if (!img || !img.complete) return;
            const ratio = Math.max(canvas.width / img.width, canvas.height / img.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, img.width, img.height, (canvas.width - img.width * ratio) / 2, (canvas.height - img.height * ratio) / 2, img.width * ratio, img.height * ratio);  
        }
        images[0].onload = () => render(0);
        window.addEventListener('scroll', () => { 
            let maxS = document.documentElement.scrollHeight - window.innerHeight; if(maxS <= 0) maxS = 1;
            targetFrame = Math.min(frameCount - 1, Math.floor(Math.max(0, Math.min(1, document.documentElement.scrollTop / maxS)) * frameCount)); 
        });
        function update() { currentFrameIndex += (targetFrame - currentFrameIndex) * 0.08; render(Math.round(currentFrameIndex)); requestAnimationFrame(update); }
        requestAnimationFrame(update); window.addEventListener('resize', () => { resizeCanvas(); render(Math.round(currentFrameIndex)); });

        // Blog API Integration
        const API = '/api';
        let currentCategory = 'all';
        let currentSearch = '';
        let searchTimer = null;

        async function loadCategories() {
            try {
                const cats = await fetch(`${API}/blogs/categories/list`).then(r => r.json());
                const filters = document.getElementById('category-filters');
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.cat = cat;
                    btn.textContent = cat;
                    btn.onclick = () => filterByCategory(cat);
                    filters.appendChild(btn);
                });
            } catch {}
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            loadBlogs();
        }

        function debouncedSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = document.getElementById('search-input').value;
                loadBlogs();
            }, 400);
        }

        async function loadBlogs() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('blog-grid').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';

            const params = new URLSearchParams({ page: 1, limit: 12 });
            if (currentCategory !== 'all') params.set('category', currentCategory);
            if (currentSearch) params.set('search', currentSearch);

            try {
                const data = await fetch(`${API}/blogs?${params}`).then(r => r.json());
                const blogs = data.data || [];
                document.getElementById('loading').style.display = 'none';

                if (!blogs.length) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                document.getElementById('blog-grid').style.display = 'grid';
                document.getElementById('blog-grid').innerHTML = blogs.map(b => `
                    <a href="blog-detail.html?slug=${b.slug}" class="card">
                        <div>
                            <div class="card-subtitle">${b.category || 'ARTICLE'}</div>
                            <div class="card-title">${b.title}</div>
                            <div class="card-text">${b.excerpt || ''}</div>
                        </div>
                        <div class="card-footer">
                            <span>👁 ${b.read_count || 0} READS</span>
                            <span style="color:var(--accent);">READ ARTICLE &rarr;</span>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                document.getElementById('loading').innerHTML = '⚠️ Failed to load articles. Server may be offline.';
            }
        }

        loadCategories();
        loadBlogs();
    </script>
    <script src="/assets/js/layout-components.js"></script>
</body>
</html>
