<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Md Abir Hassan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #1a1a30;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6c63ff;
            --accent2: #f50057;
            --accent3: #00f5ff;
            --text: #f0f0ff;
            --muted: #8888aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            font-size: 0.85rem;
            color: var(--muted);
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        /* HERO */
        .blog-hero {
            padding: 5rem 2rem 3rem;
            text-align: center;
            background: radial-gradient(ellipse at 50% 0%, rgba(108, 99, 255, 0.15) 0%, transparent 60%);
        }

        .blog-hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .blog-hero p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* FILTERS */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 1.5rem 0;
        }

        .filter-btn {
            padding: 0.45rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            font-family: inherit;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* SEARCH */
        .search-bar {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-bar .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        /* BLOG GRID */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding-bottom: 3rem;
        }

        .blog-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            border-color: rgba(108, 99, 255, 0.3);
        }

        .blog-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(245, 0, 87, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .blog-card-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-category {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
        }

        .blog-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .blog-excerpt {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
            flex: 1;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .blog-reads {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .read-more {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            padding: 0.4rem 0.875rem;
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 20px;
            transition: background 0.2s;
        }

        .read-more:hover {
            background: rgba(108, 99, 255, 0.15);
        }

        .badge-featured {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(108, 99, 255, 0.15);
            color: var(--accent);
            margin-left: 0.4rem;
        }

        .badge-hot {
            background: rgba(245, 0, 87, 0.15);
            color: var(--accent2);
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem 0;
        }

        .page-btn {
            padding: 0.5rem 0.875rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--muted);
        }

        .empty .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #loading {
            text-align: center;
            padding: 4rem;
            color: var(--muted);
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="nav-logo">Md Abir Hassan</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog.html" style="color:var(--text)">Blog</a>
            <a href="/#contact">Contact</a>
        </div>
    </nav>

    <section class="blog-hero">
        <h1>Knowledge Sharing</h1>
        <p>Insights on QA, project management, web development, and career growth</p>
    </section>

    <div class="container">
        <!-- Search -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search articles..." oninput="debouncedSearch()">
        </div>

        <!-- Category Filters -->
        <div class="filters" id="category-filters">
            <button class="filter-btn active" data-cat="all" onclick="filterByCategory('all')">All Posts</button>
        </div>

        <!-- Blog Grid -->
        <div id="loading">Loading articles...</div>
        <div class="blog-grid" id="blog-grid" style="display:none"></div>
        <div class="empty" id="empty-state" style="display:none">
            <div class="icon">📭</div>
            <p>No articles found</p>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>
        <p>© 2024 Md Abir Hassan — <a href="/admin" style="color:var(--accent)">Admin</a></p>
    </footer>

    <script>
        const API = 'http://localhost:3000/api';
        let currentPage = 1;
        let currentCategory = 'all';
        let currentSearch = '';
        let searchTimer = null;

        async function loadCategories() {
            try {
                const cats = await fetch(`${API}/blogs/categories/list`).then(r => r.json());
                const filters = document.getElementById('category-filters');
                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.cat = cat;
                    btn.textContent = cat;
                    btn.onclick = () => filterByCategory(cat);
                    filters.appendChild(btn);
                });
            } catch { }
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            loadBlogs();
        }

        function debouncedSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = document.getElementById('search-input').value;
                currentPage = 1;
                loadBlogs();
            }, 400);
        }

        async function loadBlogs() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('blog-grid').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';

            const params = new URLSearchParams({ page: currentPage, limit: 9 });
            if (currentCategory !== 'all') params.set('category', currentCategory);
            if (currentSearch) params.set('search', currentSearch);

            try {
                const data = await fetch(`${API}/blogs?${params}`).then(r => r.json());
                const blogs = data.data || [];

                document.getElementById('loading').style.display = 'none';
                if (!blogs.length) {
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                document.getElementById('blog-grid').style.display = 'grid';
                document.getElementById('blog-grid').innerHTML = blogs.map(b => `
        <a href="blog-detail.html?slug=${b.slug}" class="blog-card">
          <div class="blog-card-img">
            ${b.image ? `<img src="${b.image}" alt="${b.title}" style="width:100%;height:100%;object-fit:cover">` : '📝'}
          </div>
          <div class="blog-card-body">
            <div class="blog-category">
              ${b.category || 'Article'}
              ${b.featured ? '<span class="badge-featured">⭐ Featured</span>' : ''}
              ${b.top_reading ? '<span class="badge-featured badge-hot">🔥 Trending</span>' : ''}
            </div>
            <div class="blog-title">${b.title}</div>
            <div class="blog-excerpt">${b.excerpt || ''}</div>
            <div class="blog-meta">
              <span class="blog-reads">👁 ${b.read_count} reads</span>
              <span class="read-more">Read More →</span>
            </div>
          </div>
        </a>
      `).join('');

                // Pagination
                renderPagination(data.pages, data.page);
            } catch (e) {
                document.getElementById('loading').innerHTML = '❌ Failed to load blogs. Is the server running?';
            }
        }

        function renderPagination(totalPages, currentPg) {
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            const btns = [];
            btns.push(`<button class="page-btn" onclick="goPage(${currentPg - 1})" ${currentPg <= 1 ? 'disabled' : ''}>← Prev</button>`);
            for (let i = 1; i <= totalPages; i++) {
                btns.push(`<button class="page-btn ${i === currentPg ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
            }
            btns.push(`<button class="page-btn" onclick="goPage(${currentPg + 1})" ${currentPg >= totalPages ? 'disabled' : ''}>Next →</button>`);
            pg.innerHTML = btns.join('');
        }

        function goPage(p) { currentPage = p; loadBlogs(); window.scrollTo(0, 0); }

        // Init
        loadCategories();
        loadBlogs();
    </script>
</body>

</html>
