<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Md Abir Hassan</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/portfolio.css">
    <style>
        .hero-title { font-family: 'DM Serif Display', serif; font-size: 60px; font-weight: 400; line-height: 1.1; color: #fff; margin-bottom: 20px; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .post-meta { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 35px; display: flex; gap: 20px; }
        .post-body { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 40px; border-radius: 12px; font-size: 16px; font-weight: 300; line-height: 1.8; color: rgba(255,255,255,0.85); margin-bottom: 30px; }
        .post-body p { margin-bottom: 20px; }
        .post-body h2, .post-body h3 { font-family: 'Outfit', sans-serif; color: #fff; margin: 30px 0 15px 0; }
        .post-body code { background: rgba(0,229,255,0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>
    <div class="overlay"></div>
    
    <div id="fixed-ui">
        <header class="interactive">
            <a href="index.html" class="logo">A<span class="logo-x">H</span></a>
            <div class="right-logo"><div class="yesex-logo">ARTICLE</div></div>
        </header>

        <div class="social-links interactive">
            <a href="https://linkedin.com/in/abirhassan">LINKEDIN</a>
            <a href="#">GITHUB</a>
        </div>

        <footer class="interactive">
            <div class="footer-left">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="experience.html">EXPERIENCE</a>
                <a href="qa-testing.html">QA & TESTING</a>
                <a href="pm-details.html">PM DETAILS</a>
                <a href="projects.html">PROJECTS</a>
                <a href="web-dev.html">WEB DEV</a>
                <a href="blog.html" class="active">BLOG</a>
            </div>
            <div class="footer-right">
                <a href="contact.html">CONTACT</a>
            </div>
        </footer>
    </div>

    <div id="scroll-content">
        <section class="section align-left" style="padding-top: 140px; padding-bottom: 100px;">
            <div class="content-wrapper">
                <a href="blog.html" class="btn interactive" style="margin-bottom: 35px; padding: 10px 22px;">&larr; Back to Blog</a>
                
                <div id="loading" style="color:var(--accent); font-family:'Outfit'; letter-spacing:2px; font-weight:700;">LOADING ARTICLE...</div>
                
                <div id="article-content" style="display:none;">
                    <div class="post-meta">
                        <span id="post-category">CATEGORY</span>
                        <span id="post-reads">0 READS</span>
                    </div>
                    <div class="hero-title" id="post-title">Article Title</div>
                    <div class="post-body" id="post-body"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="/assets/js/canvas-animation.js"></script>
    <script>
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');

        async function loadArticle() {
            if (!slug) {
                document.getElementById('loading').innerHTML = '❌ Article not found.';
                return;
            }
            try {
                const b = await fetch(`${API}/blogs/${slug}`).then(r => r.json());
                document.getElementById('loading').style.display = 'none';
                document.getElementById('article-content').style.display = 'block';
                
                document.getElementById('post-title').textContent = b.title;
                document.getElementById('post-category').textContent = (b.category || 'ARTICLE').toUpperCase();
                document.getElementById('post-reads').textContent = `👁 ${b.read_count || 0} READS`;
                document.getElementById('post-body').innerHTML = b.content || b.excerpt || 'No content available.';
                document.title = `${b.title} - Md Abir Hassan`;
            } catch (e) {
                document.getElementById('loading').innerHTML = '❌ Failed to load article.';
            }
        }
        loadArticle();
    </script>
</body>
</html>
