<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post — Md Abir Hassan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #1a1a30;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6c63ff;
            --accent2: #f50057;
            --text: #f0f0ff;
            --muted: #8888aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: var(--accent);
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            font-size: 0.85rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        /* HERO */
        .post-hero {
            padding: 4rem 1.5rem 3rem;
            background: radial-gradient(ellipse at 50% 0%, rgba(108, 99, 255, 0.12) 0%, transparent 60%);
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            text-decoration: none;
            transition: color .2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        .post-category {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: .5rem;
        }

        .post-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 1rem;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--muted);
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: .25rem;
        }

        .post-badge {
            padding: .15rem .5rem;
            border-radius: 20px;
            font-size: .65rem;
            font-weight: 700;
        }

        .post-badge.featured {
            background: rgba(108, 99, 255, .2);
            color: var(--accent);
        }

        .post-badge.trending {
            background: rgba(245, 0, 87, .2);
            color: var(--accent2);
        }

        /* COVER IMAGE */
        .post-cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 16px;
            margin: 2rem 0;
            border: 1px solid var(--border);
        }

        /* CONTENT */
        .post-content {
            line-height: 1.85;
            font-size: 1rem;
            color: rgba(240, 240, 255, 0.9);
            padding-bottom: 4rem;
        }

        .post-content h1,
        .post-content h2,
        .post-content h3 {
            color: var(--text);
            margin: 2rem 0 0.75rem;
            font-weight: 700;
        }

        .post-content h1 {
            font-size: 1.75rem;
        }

        .post-content h2 {
            font-size: 1.4rem;
        }

        .post-content h3 {
            font-size: 1.15rem;
        }

        .post-content p {
            margin-bottom: 1.25rem;
        }

        .post-content ul,
        .post-content ol {
            margin: 0 0 1.25rem 1.5rem;
        }

        .post-content li {
            margin-bottom: 0.35rem;
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            background: rgba(108, 99, 255, 0.07);
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            color: var(--muted);
            font-style: italic;
        }

        .post-content code {
            background: rgba(108, 99, 255, 0.12);
            padding: .15rem .4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
        }

        .post-content pre {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 12px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .post-content pre code {
            background: none;
            padding: 0;
        }

        .post-content a {
            color: var(--accent);
        }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }

        /* RELATED */
        .related-section {
            padding: 3rem 0;
            border-top: 1px solid var(--border);
        }

        .related-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .related-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            text-decoration: none;
            color: var(--text);
            transition: border-color .2s;
        }

        .related-card:hover {
            border-color: rgba(108, 99, 255, .4);
        }

        .related-category {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: .4rem;
        }

        .related-title {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* LOADING */
        #loading {
            text-align: center;
            padding: 5rem 1rem;
        }

        .spin {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--border);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
    
    .hero__content * {
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 2px 5px rgba(0, 0, 0, 0.9);
      color: #ffffff;
    }
    .hero__summary strong {
      color: var(--color-accent-bright);
    }
    .text-accent {
      color: var(--color-accent-bright) !important;
    }
  </style>
</head>

<body>
  <canvas id="scroll-sequence" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; pointer-events: none;"></canvas>

    <nav>
        <a href="/" class="nav-logo">Md Abir Hassan</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/blog.html">Blog</a>
            <a href="/#contact">Contact</a>
        </div>
    </nav>

    <div id="loading" style="display:none">
        <div class="spin"></div>
        <p style="margin-top:1rem;color:var(--muted)">Loading post...</p>
    </div>

    <div id="post-container" style="display:none">
        <section class="post-hero">
            <div class="container">
                <a href="/blog.html" class="back-link">← Back to Blog</a>
                <div class="post-category" id="post-category"></div>
                <h1 class="post-title" id="post-title"></h1>
                <div class="post-meta" id="post-meta"></div>
            </div>
        </section>
        <div class="container">
            <img class="post-cover" id="post-cover" src="" alt="" style="display:none">
            <article class="post-content" id="post-content"></article>
            <div class="related-section" id="related-section" style="display:none">
                <h3>Related Articles</h3>
                <div class="related-grid" id="related-grid"></div>
            </div>
        </div>
    </div>

    <div id="not-found" style="display:none;text-align:center;padding:5rem 1rem;">
        <div style="font-size:3rem;margin-bottom:1rem">📭</div>
        <h2>Post not found</h2>
        <p style="color:var(--muted);margin:1rem 0">This blog post doesn't exist or has been removed.</p>
        <a href="/blog.html" style="color:var(--accent)">← Back to Blog</a>
    </div>

    <footer>
        <p>© 2024 Md Abir Hassan — <a href="/admin">Admin</a></p>
    </footer>

    <script>
        const API = window.location.hostname === 'localhost' && window.location.port === '5173' ? 'http://localhost:3000/api' : '/api';

        async function loadPost() {
            const slug = new URLSearchParams(location.search).get('slug');
            if (!slug) { showNotFound(); return; }

            document.getElementById('loading').style.display = 'block';

            try {
                const post = await fetch(`${API}/blogs/${slug}`).then(r => {
                    if (!r.ok) throw new Error('not found');
                    return r.json();
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('post-container').style.display = 'block';
                document.title = post.title + ' — Md Abir Hassan';

                if (post.meta_desc) {
                    const m = document.createElement('meta');
                    m.name = 'description'; m.content = post.meta_desc;
                    document.head.appendChild(m);
                }

                document.getElementById('post-category').textContent = post.category || '';
                document.getElementById('post-title').textContent = post.title;

                const badges = [
                    post.featured ? '<span class="post-badge featured">⭐ Featured</span>' : '',
                    post.top_reading ? '<span class="post-badge trending">🔥 Trending</span>' : '',
                ].filter(Boolean).join('');

                document.getElementById('post-meta').innerHTML = `
        <span>📅 ${new Date(post.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })}</span>
        <span>👁 ${post.read_count} reads</span>
        ${badges}
      `;

                if (post.image) {
                    const img = document.getElementById('post-cover');
                    img.src = post.image;
                    img.alt = post.title;
                    img.style.display = 'block';
                }

                document.getElementById('post-content').innerHTML = post.content || '<p>No content available.</p>';
                loadRelated(post.category, slug);

            } catch {
                document.getElementById('loading').style.display = 'none';
                showNotFound();
            }
        }

        function showNotFound() {
            document.getElementById('not-found').style.display = 'block';
        }

        async function loadRelated(category, currentSlug) {
            if (!category) return;
            try {
                const data = await fetch(`${API}/blogs?category=${encodeURIComponent(category)}&limit=3`).then(r => r.json());
                const related = (data.data || []).filter(p => p.slug !== currentSlug).slice(0, 3);
                if (!related.length) return;
                document.getElementById('related-section').style.display = 'block';
                document.getElementById('related-grid').innerHTML = related.map(p => `
        <a href="blog-detail.html?slug=${p.slug}" class="related-card">
          <div class="related-category">${p.category}</div>
          <div class="related-title">${p.title}</div>
        </a>
      `).join('');
            } catch { }
        }

        loadPost();
    </script>
<script type="module" src="/src/js/sequence.js"></script>
</body>

</html>
