<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Md Abir Hassan</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/portfolio.css">
    <script src="/assets/js/layout-components.js" defer></script>
</head>
<body>
    <canvas id="animationCanvas"></canvas>
    <div class="overlay"></div>
    
    <div id="fixed-ui"></div>

    <div id="scroll-content">
        <section class="section hero align-center">
            <div class="content-wrapper" style="max-width: 650px;">
                <div class="hero-text">
                    LET'S<br>
                    CONNECT
                </div>
                <div class="subtitle">Get In Touch for QA, PM, & Web Engineering</div>

                <div class="contact-card">
                    <form id="contact-form" onsubmit="submitForm(event)">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Project Inquiry / QA Consulting" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn interactive">Send Message &rarr;</button>
                        <div id="status-msg" style="margin-top: 15px; text-align: center; font-weight: 500; display: none;"></div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="/assets/js/canvas-animation.js"></script>
    <script>
        async function submitForm(e) {
            e.preventDefault();
            const msgEl = document.getElementById('status-msg');
            msgEl.style.display = 'block';
            msgEl.style.color = '#00E5FF';
            msgEl.textContent = 'Sending message...';

            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    msgEl.style.color = '#00E5FF';
                    msgEl.textContent = '✅ Message sent successfully! I will reply soon.';
                    document.getElementById('contact-form').reset();
                } else {
                    throw new Error();
                }
            } catch (err) {
                msgEl.style.color = '#FF5252';
                msgEl.textContent = '❌ Failed to send message. Please try emailing directly.';
            }
        }
    </script>
</body>
</html>
